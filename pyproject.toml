[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal"
version = "0.1.0"
description = "Unimodal and multimodal (vision + text) training and explainability on the Rico dataset"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alexandre Luquetta" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
