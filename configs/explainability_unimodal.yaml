# Unimodal Explainability — OBI ΔP_img + SHAP Visual + figura espelhada.
# Único config de explicabilidade unimodal; o módulo ainda se chama
# unimodal_v2.py e usa unimodal.py como biblioteca.
# Loaded by: src/multimodal/explainability/unimodal_v2.py :: explain(config)
#
# V2 adiciona sobre a v1:
#   - Object-level deletion (ObEy): zera top-K componentes UI, mede ΔP_img.
#   - SHAP Visual (KernelExplainer + superpixels SLIC).
#   - Grad-CAM cru salvo em .npy por tela (para Fase 2/C2 comparison).
#   - Estrutura de saída por app (apps/<pkg>/) + components_ranked.csv.
#   - Figura screen/app = multimodal v2 menos as linhas de texto.
#
# Reutiliza o modelo treinado do pipeline unimodal.
# Saídas em results/explanations/unimodal_v2/explicabilidade_v2_<timestamp>/.

# Image (must match training — MobileNetV2 input)
img_size: 224

# Grad-CAM (reusa v1)
gradcam_smoothing: false            # augmentation smoothing (~6x slower)
gradcam_metrics: []                 # subset of ["cam_mult", "road"]
road_percentiles: [20, 40, 60, 80]

# V2: Object-level deletion (ObEy-style)
# Número de componentes UI (top-K por score_mean) zerados em conjunto para
# medir ΔP_img. Semântica do paper ObEy (ICCV 2023).
obi_top_k_components: 3

# V2: SHAP Visual sobre superpixels SLIC
# Custo típico: ~15-25min em run N=40 apps (40 apps × ~6-8 telas × 500 predicts).
# Desative (shap_enabled=false) para runs rápidos de validação visual.
shap_enabled: true
shap_max_evals: 500
shap_n_segments: 50

# Amostra canônica para comparação C2/C3 com multimodal v2.
#
# Quando setado (path para um run do multimodal v2 já finalizado), o modo 4
# do unimodal pula o scope prompt e processa EXATAMENTE os mesmos apps do
# run multimodal referenciado. Garante 100% de interseção app-level, essencial
# para o compare_xai.py pareado — caso contrário, top-N-por-confidence do
# unimodal diverge do multimodal (só 7/40 apps coincidiriam).
#
# Deixe comentado (ou string vazia) para usar o scope prompt interativo.
apps_from_multimodal_run: "results/explanations/multimodal_v2/explicabilidade_v6_20260429_131752"
