# Multimodal explainability configuration.
# Loaded by: src/multimodal/explainability/multimodal_v3.py :: explain(config)
#
# Único config de explicabilidade multimodal (V1 e V2 saíram do menu; seus
# módulos seguem no código como bibliotecas da V3):
# - O Grad-CAM mira a Conv2D pós-fusão (`fusion_conv2d`) da arquitetura V3 de
#   treinamento, em vez da última conv do MobileNetV2.
# - Saídas em results/explanations/multimodal_v3/.
# - Espera modelo salvo por src/multimodal/training/multimodal_v3.py (arquitetura
#   de fusão espacial: broadcast + Conv2D pós-fusão).
#
# Todas as demais chaves (ablation, OBI, per-review, SHAP) são idênticas à v2 e
# herdam o mesmo significado.

# Image (must match training — MobileNetV2 input)
img_size: 224

# Text / DeBERTa (must match training)
max_text_length: 128
deberta_model: "yangheng/deberta-v3-base-absa-v1.1"
aspect: "interface"

# SHAP (higher = more accurate, slower)
shap_max_evals: 500

# Optional Grad-CAM enhancements (pytorch-grad-cam inspired)
gradcam_smoothing: false           # augmentation smoothing (~6x slower, visually cleaner)
gradcam_metrics: []                # subset of: ["cam_mult", "road"] — faithfulness contínua
road_percentiles: [20, 40, 60, 80]

# Modo 10 (Top 10 melhores/piores apps): fonte das palavras top exibidas.
# Aponte para um run V3 completo quando existir; até lá, deixe em branco/comente
# para auto-discovery.
# mode10_v2_run_dir: "results/explanations/multimodal_v3/explicabilidade_v6_YYYYMMDD_HHMMSS"

# Modo 11 (Apps de uma pasta): caminho para um run XAI anterior (V2 ou V3) que
# contenha app_explanations.json + screen_explanations.json. Mode 11 usa
# EXATAMENTE os apps daquela pasta (sem top-K), splita em BOM/RUIM pela
# classificação do modelo atual, e gera figuras Grad-CAM/SHAP. Permite
# comparação 1:1 (V2 vs V3) sobre os MESMOS apps + telas + reviews.
# Quando ausente, cai em mode10_v2_run_dir como fallback.
#mode11_apps_dir: "results/explanations/multimodal_v3/explicabilidade_v6_20260602_231430"
mode11_apps_dir: "results/explanations/multimodal_v3/explicabilidade_v6_20260726_202438"

# Modos 10/11: pula a etapa SHAP (visual + textual), gerando apenas as figuras
# Grad-CAM + Bahdanau. Útil para o eixo 2, cujos 3 termos textuais vêm do
# Bahdanau. Default false (mantém o SHAP).
skip_shap: true

# Modo 11: limita cada classe (BOM/RUIM) aos N apps mais confiantes na figura.
# A seleção já vem ordenada por confiança agregada desc. Default 10.
# Use 0 (ou negativo) para sem limite (todos os apps da pasta).
mode11_max_apps: 10

# V3: Faithfulness (ΔP_img) + Object-level deletion (idêntico ao v2)
ablation_enabled: true
ablation_top_k_tokens: 3
obi_top_k_components: 3

# Per-review analysis (idêntico ao v2)
per_review_analysis: true
per_review_top_k: 5
per_review_min_words: 5
per_review_source: "raw+cache"
per_review_min_words_raw: 15
per_review_generate_figures: true
per_review_include_shap: true
per_review_shap_max_evals: 500

# Critério da tela representante do app na figura agregada (modos 3 e 4):
#   - "delta_p_img" (default): maior ΔP sob oclusão das regiões top-Grad-CAM,
#     ou seja, a tela cuja explicação visual é mais fiel.
#   - "confidence": maior confiança da tela, mesmo critério dos modos 10 e 11,
#     o que faz as duas figuras mostrarem a mesma tela para o mesmo app.
# Trocar este valor muda a tela mostrada em TODAS as figuras app-level do run.
app_rep_screen_criterion: "delta_p_img"

# Subpasta em data/embeddings_cache/ a usar como fonte dos embeddings.
# Para validação inicial do v3, deixe em branco (usa raiz / não polarizado),
# para alinhar com a run de treino v3 que ficou em resultados_20260601_133050.
# embeddings_cache_subdir: "polarized_top20"

# Lista canônica de apps herdada de outro run multimodal. Quando setada, o
# Modo 4 ("Explicar todos os apps") pula o prompt de escopo e processa
# exatamente os ``package_name`` listados no ``app_explanations.json`` do run
# referenciado, filtrados pela interseção com o CSV deste modelo V3. Permite
# comparar XAI V3 vs V2 (ou V3 vs V1) sobre o MESMO conjunto de apps.
# Mesmo mecanismo já existente em explainability/unimodal.py.
apps_from_multimodal_run: "results/explanations/multimodal_v2/explicabilidade_v6_20260429_131752"
